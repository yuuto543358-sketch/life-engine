<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f3ef" />
    <meta name="description" content="時間・お金・目標をひとつの計画として計算し、人生の選択肢を比べるシミュレーター" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LIFE ENGINE" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>LIFE ENGINE</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- アプリが起動できなかったときに、真っ白な画面ではなく理由を表示する -->
    <div id="boot-fallback" hidden style="font-family:-apple-system,sans-serif;padding:32px 24px;line-height:1.7;color:#0b0b0b;background:#f4f3ef;min-height:100vh">
      <p style="font-weight:700;font-size:18px;margin:0 0 8px">LIFE ENGINE を起動できませんでした</p>
      <p style="margin:0 0 8px;font-size:15px">ページを再読み込みしてください。直らない場合は、iPhone の iOS を最新にするか、Safari で開いてください。</p>
      <p id="boot-error" style="font-size:12px;color:#75736d;word-break:break-all;margin:0"></p>
    </div>
    <script>
      (function () {
        function show(msg) {
          if (document.getElementById('root').childElementCount > 0) return;
          var f = document.getElementById('boot-fallback');
          f.hidden = false;
          if (msg) document.getElementById('boot-error').textContent = String(msg);
        }
        window.addEventListener('error', function (e) { show(e.message); });
        window.addEventListener('unhandledrejection', function (e) { show(e.reason && e.reason.message); });
        setTimeout(function () { show(''); }, 8000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
